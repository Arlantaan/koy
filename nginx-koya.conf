# koya.living / www.koya.living — permanent 301 redirect to koyagambia.com.
# The restaurant's table QR codes still point at koya.living; this forwards
# every request (and its path) straight to the new domain, seamlessly.
server {
    listen 443 ssl;
    server_name koya.living www.koya.living;

    ssl_certificate /etc/letsencrypt/live/koya.living/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/koya.living/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://koyagambia.com$request_uri;
}

server {
    listen 80;
    server_name koya.living www.koya.living;
    return 301 https://koyagambia.com$request_uri;
}
